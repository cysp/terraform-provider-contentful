WebhookDefinitionFields:
  type: object
  properties:
    name:
      type: string
    url:
      type: string
    topics:
      type: array
      items:
        type: string
    filters:
      type: array
      items:
        $ref: "./filters.yml#/WebhookDefinitionFilter"
      nullable: true
    httpBasicUsername:
      type: string
      nullable: true
    httpBasicPassword:
      type: string
      nullable: true
    transformation:
      $ref: "#/WebhookDefinitionTransformation"
    active:
      type: boolean
  required:
    - name
    - url
    - topics

WebhookDefinitionData:
  allOf:
    - $ref: "#/WebhookDefinitionFields"
    - type: object
      properties:
        headers:
          $ref: "./headers.yml#/WebhookDefinitionRequestHeaders"

WebhookDefinitionCreateData:
  allOf:
    - $ref: "#/WebhookDefinitionFields"
    - type: object
      properties:
        headers:
          $ref: "./headers.yml#/WebhookDefinitionCreateHeaders"

WebhookDefinitionTransformation:
  type: object
  properties:
    method:
      type: string
    contentType:
      type: string
    includeContentLength:
      type: boolean
    body: {}
  nullable: true
