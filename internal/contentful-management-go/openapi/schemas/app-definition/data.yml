AppDefinitionData:
  type: object
  properties:
    name:
      type: string
    src:
      type: string
    bundle:
      $ref: "../links/app-bundle-link.yml#/AppBundleLink"
    locations:
      type: array
      items:
        $ref: "./location.yml#/AppDefinitionLocationsItem"
    parameters:
      $ref: "./parameters.yml#/AppDefinitionParameters"
  required:
    - name
