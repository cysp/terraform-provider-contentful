RoleCollection:
  type: object
  properties:
    sys:
      type: object
      properties:
        type:
          type: string
          enum: [Array]
      required: [type]
    total:
      type: integer
    skip:
      type: integer
    limit:
      type: integer
    items:
      type: array
      items:
        $ref: "./role.yml#/Role"
  required: [sys, items]
