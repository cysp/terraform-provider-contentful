name: Release Please

on:
  workflow_call:
    inputs:
      operation:
        description: Release Please operation (prepare-release-pr or create-release)
        type: string
        required: true

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: release-please
  queue: max

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release-preparation
      deployment: false
    steps:
      - name: Validate operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            prepare-release-pr|create-release) ;;
            *) echo "::error::operation must be prepare-release-pr or create-release"; exit 1 ;;
          esac

      - id: app
        uses: chikachow/cyspbot-app-token-action@bf8d299cd20f755c47feb733e3c0f56331a4b49e # v0.0.12
        with:
          cyspbot-token-url: https://github-app-token-broker.chikachow.org/github/apps/cyspbot-releaser/token
          scope: contents:write issues:write pull_requests:write

      - name: Identify a release PR merged at this commit
        if: inputs.operation == 'create-release'
        id: merged
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          release_pr_merged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'any(.[]; .merged_at != null and .base.ref == "main" and any(.labels[]; .name == "autorelease: pending"))')"
          echo "release_pr_merged=$release_pr_merged" >> "$GITHUB_OUTPUT"

      - id: release-please
        if: inputs.operation == 'prepare-release-pr' || steps.merged.outputs.release_pr_merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          skip-github-release: ${{ inputs.operation == 'prepare-release-pr' }}
          skip-github-pull-request: ${{ inputs.operation == 'create-release' }}

      - name: Verify release commit and dispatch publisher
        if: steps.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-please.outputs.tag_name }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
