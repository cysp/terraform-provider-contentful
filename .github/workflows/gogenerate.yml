name: go generate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - run: go generate ./...

      - run: >-
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs
          validate --provider-name=terraform-provider-contentful

      - run: |
          generated_status="$(git status --short --untracked-files=all)"
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
