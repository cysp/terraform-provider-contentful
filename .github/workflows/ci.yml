name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    uses: ./.github/workflows/gogenerate.yml

  lint:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/golangci-lint.yml

  govulncheck:
    uses: ./.github/workflows/govulncheck.yml

  test:
    uses: ./.github/workflows/test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_ACCESS_TOKEN }}

  fuzz:
    uses: ./.github/workflows/fuzz.yml

  goreleaser-check:
    uses: ./.github/workflows/goreleaser-check.yml

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - generate
      - lint
      - govulncheck
      - test
      - fuzz
      - goreleaser-check
    if: ${{ always() }}
    steps:
      - run: jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs) }}

  create-release:
    needs: ci
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: ./.github/workflows/release-please.yml
    with:
      operation: create-release
