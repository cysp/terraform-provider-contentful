name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    uses: ./.github/workflows/gogenerate.yml

  lint:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/golangci-lint.yml

  govulncheck:
    uses: ./.github/workflows/govulncheck.yml

  test:
    uses: ./.github/workflows/test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_ACCESS_TOKEN }}

  goreleaser-check:
    uses: ./.github/workflows/goreleaser-check.yml

  create-release:
    needs:
      - generate
      - lint
      - govulncheck
      - test
      - goreleaser-check
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: ./.github/workflows/release-please.yml
