name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: release
      deployment: false
    concurrency:
      group: release
      queue: max
    permissions:
      actions: read
      contents: write
      pull-requests: read
      security-events: read
      statuses: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify approval and release commit checks
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs prepare

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.release.outputs.published == 'false'
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Import GPG key
        if: steps.release.outputs.published == 'false'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_PASSPHRASE }}

      - name: Run GoReleaser
        if: steps.release.outputs.published == 'false'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version-file: .tool-versions
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Verify signed checksums
        if: steps.release.outputs.published == 'false'
        run: |
          version="${GITHUB_REF_NAME#v}"
          project=terraform-provider-contentful
          checksum="${project}_${version}_SHA256SUMS"
          cp terraform-registry-manifest.json "dist/${project}_${version}_manifest.json"
          (cd dist && sha256sum --check "$checksum")
          gpg --batch --verify "dist/${checksum}.sig" "dist/$checksum"

      - name: Verify draft assets
        if: steps.release.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: node .github/scripts/release.mjs verify

      - name: Attest release artifacts
        if: steps.release.outputs.published == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS
            dist/*_SHA256SUMS.sig

      - name: Publish verified draft
        if: steps.release.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: node .github/scripts/release.mjs publish

      - name: Check Terraform Registry availability
        continue-on-error: true
        run: node .github/scripts/release.mjs registry
