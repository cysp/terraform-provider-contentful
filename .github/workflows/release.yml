name: Publish release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: release
      deployment: false
    concurrency:
      group: release
      queue: max
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches Release Please version manifest
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "v$(jq -r '."."' .release-please-manifest.json)" = "$GITHUB_REF_NAME"

      - name: Require successful CI for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions"
          # A manual run's head_branch omits the ref type. The local reusable test
          # workflow records the fully qualified ref inherited from ci.yml.
          run_ids=$(gh api --paginate "$api/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" |
            jq -r '.workflow_runs[] | select(
              (.event == "push" and .head_branch == "main") or
              (.event == "workflow_dispatch" and any(.referenced_workflows[]?;
                .path == (env.GITHUB_REPOSITORY + "/.github/workflows/test.yml@" + env.GITHUB_SHA) and
                (.ref == "refs/heads/main" or .ref == env.GITHUB_REF)))
            ) | .id')

          for run_id in $run_ids; do
            # Rerunning release creation alone leaves the successful ci job in
            # an earlier attempt. Use the latest execution of that job.
            gate=$(gh api --paginate "$api/runs/$run_id/jobs?filter=all&per_page=100" |
              jq -rs '[.[].jobs[] | select(.name == "ci")] | max_by(.run_attempt)
                | select(.conclusion == "success") | .html_url')
            if [[ -n "$gate" ]]; then
              echo "Verified CI for $GITHUB_SHA: $gate"
              exit 0
            fi
          done

          echo "::error::No successful ci job for $GITHUB_SHA on main or $GITHUB_REF. Run ci.yml on the release tag before retrying."
          exit 1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version-file: .tool-versions
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Verify signed checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          project=terraform-provider-contentful
          checksum="${project}_${version}_SHA256SUMS"
          cp terraform-registry-manifest.json "dist/${project}_${version}_manifest.json"
          gpg --batch --verify "dist/${checksum}.sig" "dist/$checksum"
          # The signed checksums must cover exactly the archives and Registry manifest.
          diff -u <(cd dist && printf '%s\n' *.zip *_manifest.json | LC_ALL=C sort) \
            <(cut -c67- "dist/$checksum" | LC_ALL=C sort)
          (cd dist && sha256sum --check --strict "$checksum")

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_manifest.json
            dist/*_SHA256SUMS
            dist/*_SHA256SUMS.sig

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published GitHub release $GITHUB_REF_NAME. Check the Terraform Registry before announcing it." >> "$GITHUB_STEP_SUMMARY"
